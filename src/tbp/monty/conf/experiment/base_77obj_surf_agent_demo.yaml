# @package _global_

defaults:
  - /monty: noresetevidencegraph_exp1000_e100_t3_tot2500
  - /monty/motor_system_config: surface_curvature_informed_goal1
  - /monty/learning_module: noresetevidence_1lm_dod0025
  - /monty/sensor_module: camera_surf_delta
  - /monty/connectivity: 1lm_1sm
  - /environment: habitat_ycb_surf_agent
  - /env_interface: eval_77obj_random_demo
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0_clip
  - /logging: detailed_info_monty_runs
  # - /hooks: monitor

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 50
    max_total_steps: 5000
    n_train_epochs: 3
    # model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_77obj/pretrained/
    model_name_or_path: ${constants.pretrained_dir}/surf_agent_1lm_10distinctobj/pretrained/
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: []
    python_log_level: DEBUG
    logging:
      run_name: base_77obj_surf_agent_demo
    monty_config:
      monty_args:
        min_eval_steps: 50
      learning_modules:
        learning_module_0:
          hypotheses_updater_args:
            include_telemetry: true
